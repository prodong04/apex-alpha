[package]
name = "apex-engine"
version = "0.1.0"
edition = "2021"
authors = ["prodong04 <dragon0401@naver.com>"]
description = "Ultra high-performance Rust Unified Market Collector, Paper/Live Trading & PnL Engine with Zero-Impact Real-time Web Dashboard"
default-run = "apex-engine"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
toml = "0.8"
rayon = "1.10"

# Web Server & WebSocket for Zero-Impact Real-time UI
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
