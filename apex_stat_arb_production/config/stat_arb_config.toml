# ==============================================================================
# APEX ALPHA - INSTITUTIONAL STAT-ARB PRODUCTION CONFIGURATION
# Two Sigma Institutional Grade Market-Neutral DTW Strategy
# ==============================================================================

[general]
strategy_name = "120H_DTW_STAT_ARB_ADAPTIVE"
version = "2.0.0"
environment = "production" # options: "backtest", "paper", "production"
log_level = "info"

[capital_and_risk]
initial_capital_usd = 10000.0
max_concurrent_slots = 5            # Max 5 Longs / 5 Shorts (Total 5 Pairs)
capital_per_slot_usd = 2000.0       # $2,000 per pair ($1,000 Short / $1,000 Long)
max_portfolio_leverage = 1.0        # Strict zero margin leverage
market_beta_target = 0.00           # Strictly beta-neutral

[pit_universe]
lookback_days = 7                   # 7-day rolling window for Point-In-Time volume
top_n_liquid_symbols = 30           # Select Top 30 by total traded volume ($P * V)
rebalance_interval_bars = 10080     # Re-evaluate universe every 7 days (10,080 1m bars)

[dtw_clustering]
lookback_hours = 120                # 120-hour (5-day) multi-scale price memory
resample_interval_mins = 5          # Resample to 5m bars for noise-filtering (24 bars/day)
sakoe_chiba_window_radius = 12      # DTW warping window constraint (1 hour max warp)
quantile_selection_cutoff = 0.08    # Top 8% closest DTW pairs selected for cohort
dtw_recompute_interval_bars = 360   # Recompute full pairwise DTW matrix every 6 hours

[volatility_and_signals]
atr_rolling_bars = 60               # 60-bar (1-hour) rolling ATR window
surge_lookback_bars = 5             # 5-minute leader price surge window
surge_atr_multiplier = 2.0          # Minimum surge = 2.0 * ATR_60m
min_surge_pct = 0.009               # Floor at 0.9% min surge
max_surge_pct = 0.025               # Cap at 2.5% max surge
volume_zscore_threshold = 2.2       # Volume explosion filter: Z >= 2.2

[exit_and_execution]
target_profit_atr_mult = 1.5        # Take Profit = 1.5 * ATR_60m (0.9% ~ 2.2%)
stop_loss_atr_mult = -1.0           # Stop Loss = -1.0 * ATR_60m (0.6% ~ 1.5%)
max_holding_timeout_bars = 25       # Fast 25-minute Ornstein-Uhlenbeck mean-reversion exit
taker_fee_bps = 5.0                 # VIP taker fee 5 bps each side (10 bps round-trip)
maker_post_only = true              # Maker Post-Only execution mode enabled
