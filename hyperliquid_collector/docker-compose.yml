version: '3.8'

services:
  market-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-market-collector
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - TARGET_COIN=BTC
      - DATA_DIR=/app/data/live
      - ENABLE_BINANCE_SPOT=true
      - ENABLE_BINANCE_FUTURES=true
      - ENABLE_HYPERLIQUID=true
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
