[package]
name = "hyperliquid-collector"
version = "0.1.0"
edition = "2021"
authors = ["prodong04 <dragon0401@naver.com>"]
description = "Ultra low-latency, resilient real-time L2 Depth and Trade tick collector for Hyperliquid"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
